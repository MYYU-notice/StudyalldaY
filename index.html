<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>温馨提示</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #fff7fb 0%, #eef6ff 45%, #f7fbff 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
  }
  .wrap {
    width: min(900px, 92vw);
    text-align: center;
    padding: 40px 15px;
  }
  .msg {
    opacity: 0;
    transform: translateY(20px) scale(.96);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 4px 18px rgba(0,0,0,.08);
    animation: show .75s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .one {
    font-size: clamp(34px, 6vw, 72px);
    color: #ff4d6d;
    animation-delay: .2s;
  }
  .two {
    margin-top: 32px;
    font-size: clamp(28px, 4.8vw, 58px);
    color: #2f66d0;
    animation-delay: 2.2s;
  }
  .emoji {
    margin-top: 28px;
    font-size: clamp(78px, 14vw, 150px);
    opacity: 0;
    transform: scale(.4) rotate(-12deg);
    animation: pop .7s cubic-bezier(.2,1.4,.3,1) 4.2s forwards;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.12));
  }
  @keyframes show {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pop {
    70% { opacity: 1; transform: scale(1.12) rotate(6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="msg one">千万不要点击</div>
    <div class="msg one">来历不明的链接</div>
    <div class="msg two">老老实实把防诈骗推文看完吧孩子</div>
    <div class="emoji" aria-label="捂嘴笑">🤭</div>
  </div>
</body>
</html>
